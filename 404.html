<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found · 35</title>
  <meta name="theme-color" content="#0b1214" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#0b1214; --ink:#e8fbf6; --dim:#9ab3ad; --purple:#2ee6c7; --green:#2ee6c7; --cyan:#7cf0dc; --line:rgba(46,230,199,.22); --card:#121a19; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--ink); }
    body { font-family:ui-sans-serif,system-ui,sans-serif; line-height:1.6; min-height:100vh; background: radial-gradient(900px 480px at 8% -8%, rgba(46,230,199,.10), transparent 55%), var(--bg); -webkit-font-smoothing:antialiased; }
    [dir="rtl"] body { font-family:"IBM Plex Sans Arabic","Noto Naskh Arabic",ui-sans-serif,sans-serif; }
    .wrap { max-width:640px; margin:0 auto; padding:24px 20px 72px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; flex-shrink:0; }
    .mark { width:40px; height:40px; border-radius:12px; background:#2ee6c7; color:#04110a; display:grid; place-items:center; font-weight:800; font-size:15px; }
    .word { font-size:12px; letter-spacing:.32em; text-transform:uppercase; color:var(--dim); }
    .header-right { display:flex; flex-wrap:wrap; align-items:center; gap:6px; justify-content:flex-end; }
    .lang { display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end; }
    .lang button { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:5px 8px; font-size:10px; cursor:pointer; }
    .lang button.on { color:#04110a; background:var(--green); border-color:var(--green); }
    .hero { margin-top:8px; }
    .banner { width:100%; border-radius:16px; overflow:hidden; border:1px solid var(--line); background:#0b1214; margin-bottom:20px; }
    .banner img { display:block; width:100%; height:auto; }
    .kicker { color:var(--green); font-size:11px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:10px; }
    .lede { font-size:17px; color:var(--dim); line-height:1.55; }
    .cta { margin-top:20px; }
    .cta a, .ask button { text-decoration:none; border-radius:999px; padding:12px 18px; font-size:14px; font-weight:600; border:0; cursor:pointer; display:inline-block; }
    .cta .primary, .ask .go { background:var(--green); color:#04110a; }
    .ask .mail { border:1px solid var(--line); color:var(--ink); background:transparent; }
    .grid { display:grid; grid-template-columns:1fr; gap:10px; margin-top:32px; }
    .card, .ask { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; }
    .card h3 { font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--green); margin-bottom:6px; }
    .card p { color:var(--dim); font-size:14px; line-height:1.5; }
    section { margin-top:36px; }
    h2 { font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--purple); margin-bottom:14px; }
    .rule { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink); background:#0f1918; border:1px solid var(--line); border-radius:14px; padding:14px 16px; line-height:1.55; }
    .doors { display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
    .door { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; transition:border-color .15s; }
    .door:hover { border-color:rgba(46,230,199,.45); }
    .door-name { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); margin-bottom:4px; }
    .door-line { font-size:14px; color:var(--dim); line-height:1.45; }
    dl { display:grid; grid-template-columns:1fr; gap:0; }
    .addr-row { display:grid; grid-template-columns:110px 1fr; gap:8px 14px; padding:10px 0; border-bottom:1px solid var(--line); align-items:baseline; }
    .addr-row:last-of-type { border-bottom:0; }
    dt { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--purple); }
    dd { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; word-break:break-all; color:var(--ink); }
    footer { margin-top:44px; padding-top:28px; border-top:1px solid var(--line); color:var(--dim); font-size:13px; text-align:center; line-height:1.85; }
    footer .signs-up, footer .signs-down { letter-spacing:.1em; font-size:15px; }
    footer .signs-up { margin-bottom:12px; }
    footer .signs-down { margin-top:12px; }
    a { color:var(--cyan); }
    .ask textarea { width:100%; min-height:88px; margin:12px 0; padding:12px; border-radius:12px; border:1px solid var(--line); background:#0f1918; color:var(--ink); font:inherit; resize:vertical; }
    .ask .out { margin-top:14px; color:var(--ink); white-space:pre-wrap; font-size:14px; }
    .ask .row { display:flex; flex-wrap:wrap; gap:8px; }
    .ask .note, .note { font-size:12px; margin-top:12px; color:var(--dim); line-height:1.55; }
    .terms { list-style:none; display:grid; gap:12px; }
    .terms li { color:var(--dim); font-size:14px; border-left:3px solid var(--green); padding-left:14px; line-height:1.55; }
    .earn { width:100%; border-collapse:collapse; margin-top:4px; }
    .earn th, .earn td { text-align:left; padding:12px 0; border-bottom:1px solid var(--line); font-size:14px; }
    .earn th { font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); padding-bottom:10px; }
    .earn td { color:var(--dim); }
    .earn td:last-child { text-align:right; font-family:ui-monospace,Menlo,Consolas,monospace; color:var(--ink); }
    .earn code { color:var(--ink); font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .sr { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (min-width:640px) {
      .wrap { max-width:720px; padding:32px 28px 88px; }
      .grid { grid-template-columns:repeat(3,1fr); gap:12px; }
      .doors { grid-template-columns:1fr 1fr; gap:12px; }
      .lede { font-size:18px; }
    }
  </style>
  <meta name="robots" content="noindex">
  <style>
    .nf{max-width:40rem;margin:12vh auto 16vh;padding:0 1rem;text-align:center}
    .nf h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 .75rem}
    .nf p{margin:0 0 1.25rem;opacity:.85}
    .nf a.home{display:inline-block;padding:.7rem 1.2rem;border-radius:999px;border:1px solid currentColor;text-decoration:none;color:var(--accent,var(--g,#2ee6c7))}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a class="brand" href="/"><div class="mark">35</div><span class="word">elghaly</span></a></header>
    <main id="main" class="nf">
      <h1>Page not found</h1>
      <p>That address is not on 35. It may have moved, or the link had a typo.</p>
      <p><a class="home" href="/">Back to 35</a></p>
    </main>
  </div>
</body>
</html>
