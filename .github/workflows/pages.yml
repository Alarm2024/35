name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build public site artifact
        run: |
          mkdir -p _site
          cp index.html protocol.json metadata.json favicon.svg .nojekyll _site/
          if [ -f themes.js ]; then cp themes.js _site/; fi
          if [ -f CNAME ]; then cp CNAME _site/; fi
          if [ -f hero.svg ]; then cp hero.svg _site/; fi
          if [ -f IMG_5183.jpeg ]; then cp IMG_5183.jpeg _site/; fi
          if [ -f 35-banner.jpg ]; then cp 35-banner.jpg _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
