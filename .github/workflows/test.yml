name: test
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: node --test scripts/test/*.test.js
      - name: No signing material in the repo
        run: node scripts/scan-secrets.js
      # Operator config is gitignored, so CI can only check the public record.
      # This catches a mint or pool address committed to protocol.json that was
      # never audited — see KILL_LIST 10.
      - name: Site publishes everything it references
        run: node scripts/check-site.js
      - name: Public record gate
        run: node scripts/gate.js --public-only --preflight
