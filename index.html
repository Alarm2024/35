<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>35 — closed desk</title>
  <meta name="description" content="Closed desk. Mail 35@elghaly.dev" />
  <meta name="theme-color" content="#0b0418" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg:#07010f; --ink:#f5f7ff; --dim:#b9b6d3; --purple:#9945ff; --green:#14f195; --cyan:#19fbff; --line:rgba(153,69,255,.28); --card:rgba(20,6,39,.72); }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--ink); }
    body { font-family:ui-sans-serif,system-ui,sans-serif; line-height:1.5; min-height:100vh; background: radial-gradient(900px 480px at 10% -10%, rgba(153,69,255,.28), transparent 55%), radial-gradient(700px 400px at 100% 0%, rgba(20,241,149,.12), transparent 50%), var(--bg); }
    [dir="rtl"] body { font-family:"IBM Plex Sans Arabic","Noto Naskh Arabic",ui-sans-serif,sans-serif; }
    .wrap { max-width:920px; margin:0 auto; padding:28px 20px 80px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .mark { width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg,var(--purple),var(--green)); display:grid; place-items:center; font-weight:800; }
    .word { font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--dim); }
    .lang { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:320px; }
    .lang button { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:999px; padding:5px 9px; font-size:11px; cursor:pointer; }
    .lang button.on { color:#07010f; background:var(--green); border-color:var(--green); }
    .sr { position:absolute; left:-9999px; }
    .hero { margin-top:28px; }
    .banner { width:100%; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#07010f; margin-bottom:18px; }
    .banner img { display:block; width:100%; height:auto; }
    .kicker { color:var(--green); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
    .lede { font-size:20px; color:var(--dim); max-width:34em; }
    .cta { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .cta a { text-decoration:none; border-radius:999px; padding:12px 16px; font-size:14px; font-weight:600; }
    .cta .primary { background:var(--green); color:#04110a; }
    .cta .ghost { border:1px solid var(--line); color:var(--ink); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:36px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
    .card h3 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); margin-bottom:8px; }
    .card p, p { color:var(--dim); font-size:15px; }
    section { margin-top:40px; }
    h2 { font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--purple); margin-bottom:12px; }
    .rule { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink); background:#11041f; border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
    dl { display:grid; grid-template-columns:150px 1fr; gap:10px 16px; }
    dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--purple); }
    dd { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; word-break:break-all; }
    footer { margin-top:48px; color:var(--dim); font-size:13px; }
    a { color:var(--cyan); }
    @media (max-width:720px){ .grid,dl{grid-template-columns:1fr;} .lang{max-width:100%;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/"><div class="mark">35</div><span class="word">elghaly</span></a>
      <div class="lang" id="langbar"></div>
    </header>
    <div class="hero">
      <div class="banner">
        <img src="IMG_5183.jpeg" alt="35 ElGhaly" width="1500" height="1007" />
      </div>
      <div class="kicker" data-i18n="kicker"></div>
      <h1 class="sr">35</h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="cta">
        <a class="primary" href="mailto:35@elghaly.dev">35@elghaly.dev</a>
        <a class="ghost" href="mailto:support@elghaly.dev">support@elghaly.dev</a>
        <a class="ghost" href="https://github.com/Alarm2024/35" data-i18n="record"></a>
      </div>
    </div>
    <div class="grid">
      <article class="card"><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p></article>
      <article class="card"><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p></article>
      <article class="card"><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p></article>
    </div>
    <section><h2 data-i18n="locked"></h2><p class="rule" data-i18n="lockedp"></p></section>
    <section>
      <h2 data-i18n="addr"></h2>
      <dl>
        <dt data-i18n="mode"></dt><dd id="mode">earned</dd>
        <dt>Mail</dt><dd><a href="mailto:35@elghaly.dev">35@elghaly.dev</a></dd>
        <dt data-i18n="support"></dt><dd><a href="mailto:support@elghaly.dev">support@elghaly.dev</a></dd>
        <dt data-i18n="mint"></dt><dd id="mint">unpublished</dd>
        <dt data-i18n="pool"></dt><dd id="pool">unpublished</dd>
      </dl>
    </section>
    <footer>✝️ 🪬 🧿 · closed desk · <a href="mailto:35@elghaly.dev">35@elghaly.dev</a></footer>
  </div>
  <script>
    var T = {
      en: { kicker:"Closed desk · not a public app", lede:"35 is a private earned-credit ledger for this desk. There is no public bot to click, no coin to buy, no deposit to send. Follow the record. Mail if you must. Mint stays unpublished until the desk books realized profit.", record:"Public record", c1t:"Closed", c1p:"The sniper and flash are not a public product.", c2t:"Earned only", c2p:"Credit later comes from signed desk-usage memos. Nobody buys 35.", c3t:"Not a listing", c3p:"No pool today. Do not look for a contract to ape.", locked:"Locked", lockedp:"Path A. Closed desk. No purchase. No redeem. No public app.", addr:"Addresses", mode:"Mode", support:"Support", mint:"Mint", pool:"Pool" },
      ar: { kicker:"مكتب مغلق · ليس تطبيقًا عامًا", lede:"35 سجل خاص لرصيد مكتسب من المكتب. لا يوجد بوت عام للضغط، ولا عملة للشراء، ولا إيداع. السك يبقى غير منشور حتى يسجل المكتب ربحًا محققًا.", record:"السجل العام", c1t:"مغلق", c1p:"القناص والفلاش ليسا منتجًا عامًا.", c2t:"مكتسب فقط", c2p:"لا أحد يشتري 35.", c3t:"ليس إدراجًا", c3p:"لا مسبح اليوم.", locked:"مثبت", lockedp:"المسار A. مكتب مغلق.", addr:"العناوين", mode:"الوضع", support:"الدعم", mint:"السك", pool:"المسبح" },
      ru: { kicker:"Закрытый деск", lede:"Нет покупки и нет депозита.", record:"Запись", c1t:"Закрыто", c1p:"Не публичный продукт.", c2t:"Только заработка", c2p:"35 нельзя купить.", c3t:"Не листинг", c3p:"Пула нет.", locked:"Фикс", lockedp:"Путь A.", addr:"Адреса", mode:"Режим", support:"Поддержка", mint:"Минт", pool:"Пул" },
      zh: { kicker:"闭门台子", lede:"没有可买的币。", record:"记录", c1t:"闭门", c1p:"非公开产品。", c2t:"仅挣取", c2p:"不能买 35。", c3t:"非上市", c3p:"无池。", locked:"已锁", lockedp:"路径 A。", addr:"地址", mode:"模式", support:"支持", mint:"锻造", pool:"池" },
      de: { kicker:"Geschlossener Desk", lede:"Keine Münze zum Kaufen.", record:"Akte", c1t:"Geschlossen", c1p:"Kein öffentliches Produkt.", c2t:"Nur verdient", c2p:"Niemand kauft 35.", c3t:"Kein Listing", c3p:"Kein Pool.", locked:"Fix", lockedp:"Pfad A.", addr:"Adressen", mode:"Modus", support:"Support", mint:"Mint", pool:"Pool" },
      es: { kicker:"Mesa cerrada", lede:"No hay moneda para comprar.", record:"Registro", c1t:"Cerrado", c1p:"No es un producto público.", c2t:"Solo ganado", c2p:"Nadie compra 35.", c3t:"Sin listado", c3p:"No hay pool.", locked:"Fijo", lockedp:"Ruta A.", addr:"Direcciones", mode:"Modo", support:"Soporte", mint:"Mint", pool:"Pool" }
    };
    var LANGS = ["en","ar","ru","zh","de","es"];
    var LABELS = { en:"EN", ar:"AR", ru:"RU", zh:"中文", de:"DE", es:"ES" };
    function applyLang(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      var pack = T[lang];
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var k = el.getAttribute("data-i18n"); if (pack[k]) el.textContent = pack[k];
      });
      document.querySelectorAll("#langbar button").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-lang") === lang);
      });
      try { localStorage.setItem("35-lang", lang); } catch (e) {}
    }
    var bar = document.getElementById("langbar");
    LANGS.forEach(function (code) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("data-lang", code); b.textContent = LABELS[code];
      b.onclick = function () { applyLang(code); }; bar.appendChild(b);
    });
    try { applyLang(localStorage.getItem("35-lang") || "en"); } catch (e) { applyLang("en"); }
    fetch("/protocol.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
      if (!p) return;
      function set(id, v) { var el = document.getElementById(id); if (el && v) el.textContent = v; }
      set("mode", p.issuanceMode); set("mint", p.mint); set("pool", p.pool);
    }).catch(function () {});
  </script>
</body>
</html>
