<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>35 — earned desk credit</title>
  <meta name="description" content="35 desk. Mail 35@elghaly.dev · support@elghaly.dev" />
  <meta name="theme-color" content="#0b0418" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg:#07010f; --ink:#f5f7ff; --dim:#b9b6d3; --purple:#9945ff;
      --green:#14f195; --cyan:#19fbff; --line:rgba(153,69,255,.28); --card:rgba(20,6,39,.72);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { background:var(--bg); color:var(--ink); }
    body {
      font-family: ui-sans-serif, system-ui, sans-serif; line-height:1.5; min-height:100vh;
      background:
        radial-gradient(900px 480px at 10% -10%, rgba(153,69,255,.28), transparent 55%),
        radial-gradient(700px 400px at 100% 0%, rgba(20,241,149,.12), transparent 50%),
        var(--bg);
    }
    .wrap { max-width:920px; margin:0 auto; padding:28px 20px 80px; }
    header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
    .mark {
      width:40px; height:40px; border-radius:12px;
      background:linear-gradient(135deg,var(--purple),var(--green));
      display:grid; place-items:center; font-weight:800;
    }
    .word { font-size:13px; letter-spacing:.32em; text-transform:uppercase; color:var(--dim); }
    .lang { display:flex; flex-wrap:wrap; gap:6px; justify-content:flex-end; max-width:280px; }
    .lang button {
      background:transparent; color:var(--dim); border:1px solid var(--line);
      border-radius:999px; padding:5px 9px; font-size:11px; cursor:pointer;
    }
    .lang button.on { color:#07010f; background:var(--green); border-color:var(--green); }
    .sr { position:absolute; left:-9999px; }
    .hero { margin-top:28px; }
    .banner { width:100%; border-radius:18px; overflow:hidden; border:1px solid var(--line); background:#07010f; margin-bottom:18px; }
    .banner svg { display:block; width:100%; height:auto; }
    .kicker { color:var(--green); font-size:12px; letter-spacing:.18em; text-transform:uppercase; }
    .lede { font-size:20px; color:var(--dim); max-width:34em; }
    .cta { display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
    .cta a { text-decoration:none; border-radius:999px; padding:12px 16px; font-size:14px; font-weight:600; }
    .cta .primary { background:var(--green); color:#04110a; }
    .cta .ghost { border:1px solid var(--line); color:var(--ink); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:36px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
    .card h3 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--green); margin-bottom:8px; }
    .card p, p, li { color:var(--dim); font-size:15px; }
    section { margin-top:40px; }
    h2 { font-size:13px; letter-spacing:.2em; text-transform:uppercase; color:var(--purple); margin-bottom:12px; }
    p+p, li+li { margin-top:8px; }
    ul { padding-left:1.15em; }
    .rule {
      font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink);
      background:#11041f; border:1px solid var(--line); border-radius:14px; padding:16px 18px;
      overflow-wrap:anywhere;
    }
    dl { display:grid; grid-template-columns:150px 1fr; gap:10px 16px; }
    dt { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--purple); padding-top:3px; }
    dd { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; word-break:break-all; }
    footer { margin-top:48px; color:var(--dim); font-size:13px; }
    a { color:var(--cyan); }
    @media (max-width:720px){ .grid,dl{grid-template-columns:1fr;} .lang{max-width:100%;} }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/"><div class="mark">35</div><span class="word">elghaly</span></a>
      <div class="lang" id="langbar"></div>
    </header>
    <div class="hero">
      <div class="banner" aria-label="35 ElGhaly">
        <svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
          <defs>
            <linearGradient id="g35" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f7fffb"/>
              <stop offset="0.45" stop-color="#14F195"/>
              <stop offset="1" stop-color="#9945FF"/>
            </linearGradient>
            <radialGradient id="glowL" cx="0.12" cy="0.1" r="0.45">
              <stop offset="0" stop-color="#9945FF" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#07010f" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="glowR" cx="0.9" cy="0.85" r="0.4">
              <stop offset="0" stop-color="#14F195" stop-opacity="0.22"/>
              <stop offset="1" stop-color="#07010f" stop-opacity="0"/>
            </radialGradient>
          </defs>
          <rect width="1200" height="630" fill="#07010f"/>
          <rect width="1200" height="630" fill="url(#glowL)"/>
          <rect width="1200" height="630" fill="url(#glowR)"/>
          <text x="70" y="390" fill="url(#g35)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="340" font-weight="800" letter-spacing="-18">35</text>
          <text x="90" y="500" fill="#eceee8" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="600" letter-spacing="14">— ELGHALY —</text>
          <g fill="none" stroke="#e8eef8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M980 90 v150 M930 145 h100"/>
            <path d="M980 310 q-55 8 -62 70 h124 q-8 -62 -62 -70z"/>
            <ellipse cx="980" cy="500" rx="70" ry="42"/>
            <circle cx="980" cy="500" r="18" fill="#7ad7ff" stroke="#c8ccd4"/>
          </g>
        </svg>
      </div>
      <div class="kicker" data-i18n="kicker"></div>
      <h1 class="sr">35</h1>
      <p class="lede" data-i18n="lede"></p>
      <div class="cta">
        <a class="primary" href="mailto:35@elghaly.dev">35@elghaly.dev</a>
        <a class="ghost" href="mailto:support@elghaly.dev">support@elghaly.dev</a>
        <a class="ghost" href="https://github.com/Alarm2024/35" data-i18n="record"></a>
      </div>
    </div>
    <div class="grid">
      <article class="card"><h3 data-i18n="c1t"></h3><p data-i18n="c1p"></p></article>
      <article class="card"><h3 data-i18n="c2t"></h3><p data-i18n="c2p"></p></article>
      <article class="card"><h3 data-i18n="c3t"></h3><p data-i18n="c3p"></p></article>
    </div>
    <section>
      <h2 data-i18n="locked"></h2>
      <p class="rule" data-i18n="lockedp"></p>
    </section>
    <section>
      <h2 data-i18n="how"></h2>
      <p data-i18n="howp"></p>
      <p class="rule" style="margin-top:14px">35-credit:<wallet>:<credit>:<week></p>
    </section>
    <section>
      <h2 data-i18n="addr"></h2>
      <dl>
        <dt data-i18n="mode"></dt><dd id="mode">earned</dd>
        <dt data-i18n="jur"></dt><dd id="jurisdiction">unpublished</dd>
        <dt data-i18n="mint"></dt><dd id="mint">unpublished</dd>
        <dt>Squads</dt><dd id="vault">unpublished</dd>
        <dt data-i18n="pool"></dt><dd id="pool">unpublished</dd>
        <dt>Mail</dt><dd><a href="mailto:35@elghaly.dev">35@elghaly.dev</a></dd>
        <dt data-i18n="support"></dt><dd><a href="mailto:support@elghaly.dev">support@elghaly.dev</a></dd>
      </dl>
    </section>
    <section>
      <h2 data-i18n="not"></h2>
      <ul>
        <li data-i18n="n1"></li>
        <li data-i18n="n2"></li>
        <li data-i18n="n3"></li>
        <li data-i18n="n4"></li>
      </ul>
    </section>
    <footer>✝️ 🪬 🧿 · <a href="mailto:35@elghaly.dev">35@elghaly.dev</a> · <a href="mailto:support@elghaly.dev">support@elghaly.dev</a></footer>
  </div>
  <script>
    var T = {
      en: {
        kicker:"Solana desk · earned only · starting",
        lede:"Desk credit for real sniper and flash usage. Not sold. Not redeemed. Brand is live. Mint is not.",
        record:"Public record", c1t:"Earned only", c1p:"Credit is created after real desk usage and a signed memo. Nobody buys 35.",
        c2t:"One book", c2p:"Later pair is 35/USDC on Meteora DAMM v2. Locked LP on Squads.",
        c3t:"Not equity", c3p:"Not a SAFE. Not a deposit receipt. Do not send funds for credits.",
        locked:"Locked decision", lockedp:"No purchase. No redeem. 1:1 to SPL 35 only if gate.js prints PASS.",
        how:"How credit is earned", howp:"The desk trades its own capital. After real usage, deskSigner posts an on-chain memo.",
        addr:"Addresses", mode:"Mode", jur:"Jurisdiction", mint:"Mint", pool:"Pool", support:"Support",
        not:"What 35 is not", n1:"Not equity in any corporation.", n2:"Not a SAFE or claim on a company.", n3:"Not a deposit receipt.", n4:"Not a promise of listing."
      },
      ru: { kicker:"Solana-desk", lede:"Не продаётся. Минт не опубликован.", record:"GitHub", c1t:"Earned", c1p:"Only after real use.", c2t:"Book", c2p:"35/USDC later.", c3t:"Not equity", c3p:"No deposits.", locked:"Locked", lockedp:"No buy. No redeem.", how:"How", howp:"Own capital.", addr:"Addresses", mode:"Mode", jur:"Jurisdiction", mint:"Mint", pool:"Pool", support:"Support", not:"Not", n1:"Not equity.", n2:"Not SAFE.", n3:"Not deposit.", n4:"No listing promise." },
      zh: { kicker:"Solana", lede:"不卖。尚未锻造。", record:"GitHub", c1t:"Earned", c1p:"Real use only.", c2t:"Book", c2p:"35/USDC later.", c3t:"Not equity", c3p:"No deposits.", locked:"Locked", lockedp:"No buy.", how:"How", howp:"Own capital.", addr:"Addresses", mode:"Mode", jur:"Jurisdiction", mint:"Mint", pool:"Pool", support:"Support", not:"Not", n1:"Not equity.", n2:"Not SAFE.", n3:"Not deposit.", n4:"No listing." },
      de: { kicker:"Solana-Desk", lede:"Nicht verkauft. Mint nicht live.", record:"GitHub", c1t:"Earned", c1p:"Nur echte Nutzung.", c2t:"Book", c2p:"Später 35/USDC.", c3t:"Kein Equity", c3p:"Keine Einzahlungen.", locked:"Locked", lockedp:"Kein Kauf.", how:"How", howp:"Eigenes Kapital.", addr:"Adressen", mode:"Modus", jur:"Rechtsraum", mint:"Mint", pool:"Pool", support:"Support", not:"Nicht", n1:"Kein Equity.", n2:"Kein SAFE.", n3:"Keine Einzahlung.", n4:"Kein Listing." },
      es: { kicker:"Mesa Solana", lede:"No se vende. Mint no publicado.", record:"GitHub", c1t:"Earned", c1p:"Solo uso real.", c2t:"Book", c2p:"Luego 35/USDC.", c3t:"No equity", c3p:"Sin depósitos.", locked:"Locked", lockedp:"Sin compra.", how:"How", howp:"Capital propio.", addr:"Direcciones", mode:"Modo", jur:"Jurisdicción", mint:"Mint", pool:"Pool", support:"Soporte", not:"No es", n1:"No equity.", n2:"No SAFE.", n3:"No depósito.", n4:"Sin listado." }
    };
    var LANGS = ["en","ru","zh","de","es"];
    var LABELS = { en:"EN", ru:"RU", zh:"中文", de:"DE", es:"ES" };
    function applyLang(lang) {
      if (!T[lang]) lang = "en";
      document.documentElement.lang = lang;
      var pack = T[lang];
      document.querySelectorAll("[data-i18n]").forEach(function (el) {
        var k = el.getAttribute("data-i18n");
        if (pack[k]) el.textContent = pack[k];
      });
      document.querySelectorAll("#langbar button").forEach(function (b) {
        b.classList.toggle("on", b.getAttribute("data-lang") === lang);
      });
      try { localStorage.setItem("35-lang", lang); } catch (e) {}
    }
    var bar = document.getElementById("langbar");
    LANGS.forEach(function (code) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("data-lang", code); b.textContent = LABELS[code];
      b.onclick = function () { applyLang(code); }; bar.appendChild(b);
    });
    try { applyLang(localStorage.getItem("35-lang") || "en"); } catch (e) { applyLang("en"); }
    fetch("/protocol.json").then(function (r) { return r.ok ? r.json() : null; }).then(function (p) {
      if (!p) return;
      function set(id, v) { var el = document.getElementById(id); if (!el || !v) return; el.textContent = v; }
      set("mode", p.issuanceMode); set("jurisdiction", p.jurisdiction); set("mint", p.mint); set("vault", p.squadsVault); set("pool", p.pool);
    }).catch(function () {});
  </script>
</body>
</html>
